<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinokio Remote — Connexion</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f0f1a;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #e0e0e0;
  }

  .bg-glow {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 60% 40% at 30% 20%, rgba(108,99,255,.12) 0%, transparent 70%),
      radial-gradient(ellipse 50% 30% at 80% 80%, rgba(167,139,250,.08) 0%, transparent 70%);
  }

  .card {
    position: relative;
    background: #1a1a2e;
    border: 1px solid #2a2a4a;
    border-radius: 20px;
    padding: 2.5rem 2.25rem 2rem;
    width: min(420px, 92vw);
    box-shadow: 0 24px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(108,99,255,.1);
  }

  .logo {
    text-align: center;
    margin-bottom: 2.2rem;
  }
  .logo-icon { font-size: 2.8rem; line-height: 1; margin-bottom: .5rem; }
  .logo h1 {
    font-size: 1.65rem;
    font-weight: 700;
    background: linear-gradient(135deg, #6c63ff 30%, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .logo p {
    margin-top: .35rem;
    color: #666;
    font-size: .88rem;
  }

  .form-group { margin-bottom: 1rem; }
  label { display: block; font-size: .82rem; color: #999; margin-bottom: .45rem; }

  input[type="password"] {
    width: 100%;
    padding: .75rem 1rem;
    background: #0f0f1a;
    border: 1px solid #2a2a4a;
    border-radius: 10px;
    color: #e0e0e0;
    font-size: 1rem;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
    -webkit-text-security: disc;
  }
  input[type="password"]:focus {
    border-color: #6c63ff;
    box-shadow: 0 0 0 3px rgba(108,99,255,.15);
  }

  .btn {
    width: 100%;
    margin-top: 1.3rem;
    padding: .82rem 1rem;
    background: linear-gradient(135deg, #6c63ff, #a78bfa);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .2s, transform .1s, box-shadow .2s;
    letter-spacing: .02em;
  }
  .btn:hover  { opacity: .92; box-shadow: 0 6px 20px rgba(108,99,255,.35); }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  .error-msg {
    margin-top: .85rem;
    padding: .6rem .9rem;
    background: rgba(255,71,87,.12);
    border: 1px solid rgba(255,71,87,.3);
    border-radius: 8px;
    color: #ff4757;
    font-size: .85rem;
    text-align: center;
    display: none;
  }
  .error-msg.visible { display: block; }

  .hint {
    margin-top: 1.4rem;
    text-align: center;
    font-size: .78rem;
    color: #444;
  }
  .hint code {
    background: rgba(255,255,255,.06);
    padding: .15rem .4rem;
    border-radius: 4px;
    font-family: 'Cascadia Code', 'Consolas', monospace;
    color: #888;
  }
</style>
</head>
<body>
<div class="bg-glow"></div>

<div class="card">
  <div class="logo">
    <div class="logo-icon">⚡</div>
    <h1>Pinokio Remote</h1>
    <p>Accès sécurisé à vos modèles IA</p>
  </div>

  <form id="loginForm" autocomplete="off">
    <div class="form-group">
      <label for="pwd">Mot de passe</label>
      <input type="password" id="pwd" placeholder="••••••••••" autofocus>
    </div>
    <button type="submit" class="btn" id="submitBtn">Se connecter</button>
    <div class="error-msg" id="errorMsg"></div>
  </form>

  <p class="hint">
    Mot de passe modifiable dans <code>config.json</code>
  </p>
</div>

<script>
  const form      = document.getElementById('loginForm');
  const btn       = document.getElementById('submitBtn');
  const errMsg    = document.getElementById('errorMsg');
  const pwdInput  = document.getElementById('pwd');

  function showError(msg) {
    errMsg.textContent = msg;
    errMsg.classList.add('visible');
  }
  function hideError() {
    errMsg.classList.remove('visible');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();
    btn.disabled = true;
    btn.textContent = 'Connexion…';

    const fd = new FormData();
    fd.append('password', pwdInput.value);

    try {
      const res = await fetch('/auth/login', { method: 'POST', body: fd });
      if (res.ok) {
        window.location.replace('/');
      } else {
        const data = await res.json().catch(() => ({}));
        showError(data.detail || 'Mot de passe incorrect');
        pwdInput.select();
      }
    } catch (_) {
      showError('Impossible de joindre le serveur');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Se connecter';
    }
  });
</script>
</body>
</html>
